# Release is version-driven: bump version in package.json, push main — this
# workflow reads it, tags the release, and publishes if the tag is new.
name: release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

jobs:
  release:
    uses: haipham22/dsm-gitops/.github/workflows/release-npm.yml@main
    with:
      build-command: pnpm -r build
      test-command: pnpm -r test
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
