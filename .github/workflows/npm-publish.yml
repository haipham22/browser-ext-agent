# Version-driven release: bump version in package.json, push main — the job
# reads it, tags the release, tests, packages, and publishes if the tag is
# new. (A reusable variant lives in haipham22/dsm-gitops release-npm.yml,
# pending GitHub cross-repo access propagation.)
name: release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.tag.outputs.skip == 'false'
        with:
          version: '12'

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.skip == 'false'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install
        if: steps.tag.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.tag.outputs.skip == 'false'
        run: pnpm -r test

      - name: Package
        if: steps.tag.outputs.skip == 'false'
        run: pnpm -r build

      - name: npm 11.5.1+ for OIDC trusted publishing
        if: steps.tag.outputs.skip == 'false'
        run: npm install -g npm@latest

      - name: Publish
        if: steps.tag.outputs.skip == 'false'
        run: npm publish --access public --provenance

      - name: Tag release
        if: steps.tag.outputs.skip == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
